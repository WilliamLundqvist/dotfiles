# Set your personal hyprland configuration here
# See https://wiki.hypr.land/Configuring for more information

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = se,swerty
    kb_options = grp:win_space_toggle
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat
    # numlock_by_default = true

    # 🔗 See https://wiki.hypr.land/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}

# Package search: Super + Alt + I → rofi + yay/paru, then install in a terminal
$l=Launcher
$d=[$l|Rofi menus]
bindd = $mainMod Alt, I, $d search and install packages, exec, pkill -x rofi || hyde-shell pkgsearch

# Move current workspace to the other monitor
$ws=Workspaces
bindd = $mainMod Alt, M, [$ws] move workspace to other monitor, movecurrentworkspacetomonitor, +1

# Switch keyboard layout
bindd = $mainMod Shift, K, [$ut] switch keyboard layout, exec, hyprctl switchxkblayout current next

# // █▀▀ █▀█ █▄░█ ▀█▀
# // █▀░ █▄█ █░▀█ ░█░

general {
    border_size = 4
    col.active_border = rgba(00ff99ee) rgba(00ccffee) 45deg
}

cursor {
    no_hardware_cursors = false
}

$FONT = JetBrainsMono Nerd Font
$FONT_SIZE = 10
$DOCUMENT_FONT = JetBrainsMono Nerd Font
$DOCUMENT_FONT_SIZE = 10
$MONOSPACE_FONT = JetBrainsMono Nerd Font
$MONOSPACE_FONT_SIZE = 10
$BAR_FONT = JetBrainsMono Nerd Font
$MENU_FONT = JetBrainsMono Nerd Font

